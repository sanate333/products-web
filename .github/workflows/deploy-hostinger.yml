name: Deploy Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy PHP/config files only (NO npm build - protect React assets)
        run: |
          sudo apt-get install -y lftp
          lftp -e "set sftp:connect-program \"ssh -o StrictHostKeyChecking=no -p 65002\"; mirror --reverse --verbose --no-perms --delete --exclude .env --exclude config.php --exclude static --exclude index.html --exclude hotfix.js --exclude cx_panel.js --exclude hotfixes --exclude .htaccess ./public_html/ domains/sanate.store/public_html/; quit" sftp://${{ secrets.HOSTINGER_FTP_USERNAME }}:${{ secrets.HOSTINGER_FTP_PASSWORD }}@${{ secrets.HOSTINGER_FTP_SERVER }}
